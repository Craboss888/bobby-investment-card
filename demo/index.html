<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fafafa">
<title>Bobby AI · Demo</title>
<link rel="icon" href="assets/img/logo.png">
<link rel="apple-touch-icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/home.css">
<link rel="stylesheet" href="assets/css/chat.css">
<link rel="stylesheet" href="assets/css/onboarding.css">
</head>
<body>
<div class="stage">
  <div class="device" id="device">
    <div class="status-bar" aria-hidden="true">
      <span class="sb-time" id="sbTime">9:41</span>
      <span class="sb-island"></span>
      <span class="sb-icons">
        <svg viewBox="0 0 18 12" class="sb-signal"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg viewBox="0 0 16 12" class="sb-wifi"><path d="M8 11.2 5.6 8.8a3.4 3.4 0 0 1 4.8 0z"/><path d="M3.4 6.6a6.5 6.5 0 0 1 9.2 0l-1.3 1.3a4.6 4.6 0 0 0-6.6 0z"/><path d="M1.1 4.3a9.8 9.8 0 0 1 13.8 0l-1.3 1.3a8 8 0 0 0-11.2 0z"/></svg>
        <span class="sb-battery"><span class="sb-battery-level"></span><span class="sb-battery-num">82</span></span>
      </span>
    </div>

    <div class="app" id="app">
      <!-- 顶栏 -->
      <header class="topbar" id="topbar">
        <div class="topbar-left">
          <button type="button" class="glass-btn" id="menuBtn" aria-label="菜单">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <button type="button" class="glass-btn is-hidden" id="homeBtn" aria-label="首页">
            <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>
          </button>
        </div>
        <div class="topbar-title">Bobby AI</div>
        <div class="topbar-right">
          <button type="button" class="glass-btn" id="newChatBtn" aria-label="新对话">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </header>

      <!-- 页面：首页信息流 / 对话 -->
      <main class="views">
        <section class="view view-home is-active" id="viewHome" aria-label="首页">
          <div class="scroll home-scroll" id="homeScroll">
            <div class="qa-marquee" id="homeQuick"></div>
            <section class="hot-section">
              <header class="section-label">Hot Trades</header>
              <div class="hot-stack" id="hotStack"></div>
            </section>
            <section class="brief-section">
              <header class="section-label">您的每日简报</header>
              <div id="briefMount"></div>
            </section>
            <section class="pro-section">
              <header class="section-label pro-label">BOBBY PRO</header>
              <div id="proMount"></div>
            </section>
          </div>
        </section>

        <section class="view view-chat" id="viewChat" aria-label="对话">
          <div class="scroll chat-scroll" id="chatScroll">
            <div class="chat-welcome" id="chatWelcome">
              <img src="assets/img/logo.png" alt="" class="chat-welcome-logo">
              <h1 class="chat-welcome-title" id="greeting">晚上好，iFeng</h1>
            </div>
            <div class="chat-thread" id="chatThread"></div>
          </div>
          <button type="button" class="scroll-down-btn" id="scrollDownBtn" aria-label="回到底部">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
          </button>
        </section>
      </main>

      <!-- 底部输入区 -->
      <footer class="composer" id="composer">
        <div class="chat-quick" id="chatQuick"></div>
        <div class="input-wrap">
          <div class="input-box pro-on" id="inputBox">
            <textarea id="input" rows="1" aria-label="问问Bobby"></textarea>
            <div class="input-actions">
              <button type="button" class="pro-switch active" id="proSwitch" aria-pressed="true">
                <span class="pro-switch-mark"></span>
                <span class="pro-switch-title">Bobby Pro</span>
              </button>
              <button type="button" class="input-action btn-attach" id="attachBtn" aria-label="添加附件">
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
              </button>
              <button type="button" class="input-action btn-mic" id="micBtn" aria-label="语音输入">
                <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
              </button>
              <button type="button" class="input-action btn-send" id="sendBtn" aria-label="发送">
                <svg class="ico-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
                <svg class="ico-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
              </button>
            </div>
            <div class="attach-panel" id="attachPanel">
              <button type="button" data-attach="image"><span class="ap-ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5-5L5 19"/></svg></span>图片</button>
              <button type="button" data-attach="file"><span class="ap-ico"><svg viewBox="0 0 24 24"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h5"/></svg></span>文件</button>
            </div>
          </div>
        </div>
      </footer>

      <!-- 侧栏 -->
      <div class="qa-sheet" id="qaSheet" aria-hidden="true">
        <div class="qa-sheet-scrim"></div>
        <div class="qa-sheet-panel" role="dialog" aria-modal="true">
          <div class="qa-sheet-head">
            <span class="qa-sheet-icon"></span>
            <span class="qa-sheet-title"></span>
            <button type="button" class="qa-sheet-close" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
          </div>
          <div class="qa-sheet-list"></div>
        </div>
      </div>

      <div class="drawer-backdrop" id="drawerBackdrop"></div>
      <aside class="drawer" id="drawer" aria-label="侧栏">
        <div class="drawer-header">
          <div class="drawer-brand">
            <div class="drawer-brand-copy">
              <div class="drawer-brand-name">Bobby AI</div>
              <div class="drawer-brand-sub">Think it. Bobby trades it.</div>
            </div>
            <button type="button" class="drawer-search-btn" id="drawerSearchBtn" aria-label="搜索对话">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            </button>
            <div class="drawer-search" id="drawerSearch">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
              <input type="text" id="drawerSearchInput" placeholder="搜索聊天记录">
              <button type="button" id="drawerSearchCancel">取消</button>
            </div>
          </div>
        </div>
        <div class="drawer-menu">
          <div class="drawer-section-label">历史对话</div>
          <div class="drawer-group-label" id="drawerGroupToday">今天</div>
          <div class="drawer-history" id="drawerHistory"></div>
          <div class="drawer-empty" id="drawerEmpty">无结果</div>
        </div>
        <div class="drawer-bottom">
          <div class="drawer-user">
            <img src="assets/img/logo.png" alt="" class="drawer-avatar">
            <div class="drawer-user-copy">
              <div class="drawer-user-name">iFeng</div>
              <div class="drawer-user-email">ifeng@example.com</div>
            </div>
            <button type="button" class="drawer-settings" id="drawerSettings" aria-label="设置">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
          </div>
        </div>
      </aside>

      <!-- 引导问卷 -->
      <section class="onboarding" id="onboarding" aria-label="引导"></section>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
    <span class="home-indicator" aria-hidden="true"></span>
  </div>
</div>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/chat.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
